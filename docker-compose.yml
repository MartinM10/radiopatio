services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: radiopatio
      POSTGRES_USER: radiopatio
      POSTGRES_PASSWORD: radiopatio_dev_secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radiopatio -d radiopatio"]
      interval: 3s
      timeout: 3s
      retries: 5

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
      - DATABASE_URL=postgres://radiopatio:radiopatio_dev_secret@db:5432/radiopatio
      - DEVICE_SALT=radiopatio_anonymous_salt_dev
      - CORS_ORIGIN=*
      - ADMIN_TOKEN=radiopatio_admin_dev
      - PURGE_INTERVAL_MINUTES=15
      - RATE_LIMIT_MAX=600
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_node_modules:/app/node_modules

  app:
    build: ./app
    ports:
      - "8081:8081"     # Metro bundler
      - "19000:19000"
      - "19001:19001"
    environment:
      - EXPO_NO_TELEMETRY=1
      - CI=false
      - REACT_NATIVE_PACKAGER_HOSTNAME=${HOST_IP:-127.0.0.1}
      - EXPO_PUBLIC_API_URL=http://${HOST_IP:-127.0.0.1}:3000
    depends_on:
      - server
    volumes:
      - ./app:/app
      - node_modules:/app/node_modules
    stdin_open: true
    tty: true

volumes:
  node_modules:
  server_node_modules:
  pgdata:
