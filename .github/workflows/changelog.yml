name: Actualizar Changelog

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión a publicar (ej: 1.2.0, o dejar vacío para la versión actual)'
        required: false
        default: ''
      dry_run:
        description: 'Modo simulación (Dry Run sin guardar ni hacer commit)'
        type: boolean
        required: false
        default: false

jobs:
  changelog:
    name: Generar Changelog desde Commits
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Ejecutar generador
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="--dry-run"
          fi
          if [ -n "${{ github.event.inputs.version }}" ]; then
            node scripts/generate-changelog.mjs "${{ github.event.inputs.version }}" $ARGS
          else
            node scripts/generate-changelog.mjs $ARGS
          fi

      - name: Guardar y subir cambios
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain CHANGELOG.md)" ]; then
            git add CHANGELOG.md
            git commit -m "docs(changelog): update CHANGELOG.md [skip ci]"
            git push
          else
            echo "CHANGELOG.md ya está actualizado."
          fi
