name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: Release Please (Changelog & Semver)
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Resumen de Release
        if: ${{ steps.release.outputs.releases_created }}
        run: |
          echo "Release creada con éxito: ${{ steps.release.outputs.tag_name }}"
          echo "Versión: ${{ steps.release.outputs.version }}"
