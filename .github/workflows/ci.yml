name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  server:
    name: Server (build + tests + parity + rate limit)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: radiopatio
          POSTGRES_USER: radiopatio
          POSTGRES_PASSWORD: radiopatio_dev_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radiopatio -d radiopatio"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://radiopatio:radiopatio_dev_secret@localhost:5432/radiopatio
      DEVICE_SALT: ci-salt-not-for-prod
      ADMIN_TOKEN: ci-admin-not-for-prod
      CORS_ORIGIN: '*'
      RATE_LIMIT_MAX: 600
      PURGE_INTERVAL_MINUTES: 15
      JUDGE_ENABLED: 0
      LOG_LEVEL: warn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run check:parity
      - run: npm run check:ratelimit
